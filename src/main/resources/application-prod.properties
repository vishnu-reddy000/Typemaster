# ==========================================================================
# TypeMaster - Production Application Configuration Profile (prod)
# ==========================================================================

# --------------------------------------------------------------------------
# Server Configuration
# --------------------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful

# --------------------------------------------------------------------------
# Spring Application
# --------------------------------------------------------------------------
spring.application.name=TypeMaster

# --------------------------------------------------------------------------
# Railway MySQL Database Configuration
# --------------------------------------------------------------------------

spring.datasource.url=jdbc:mysql://${MYSQLHOST:${DB_HOST:localhost}}:${MYSQLPORT:${DB_PORT:3306}}/${MYSQLDATABASE:${DB_NAME:typemaster}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${MYSQLUSER:${DB_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------------------------
# Hikari Connection Pool
# --------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=TypeMasterHikariCP

# --------------------------------------------------------------------------
# Hibernate / JPA
# --------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --------------------------------------------------------------------------
# Static Resource Cache
# --------------------------------------------------------------------------
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true

# HTTP Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml,font/ttf,font/otf
server.compression.min-response-size=512

# Tomcat Thread Pool Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=10000
server.tomcat.accept-count=200

# Jackson Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false